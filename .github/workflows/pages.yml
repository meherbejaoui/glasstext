name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is static and needs no build: index.html, learn.html, assets/
      # and src/ are served exactly as they are committed. We stage the files
      # the site actually needs rather than publishing the whole repository.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html learn.html _site/
          cp -r assets src _site/
          cp CNAME _site/ 2>/dev/null || true
          # .nojekyll stops GitHub Pages running the files through Jekyll,
          # which would otherwise ignore any path beginning with an underscore.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
